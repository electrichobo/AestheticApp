# AESTHETIC — runtime configuration
# All pipeline behaviour is controlled from here.
# Changes take effect on the next job run — no restart required.

io:
  outputs_dir: "data/outputs"
  baseline_path: "data/baseline.json"

runtime:
  cpu_cap_pct: 90.0        # maximum CPU usage % for parallel processing (scales to host machine)
  seed: 42
  cpu_guard_pct: 85      # pause pipeline if CPU usage exceeds this %
  gpu_guard_pct: 90      # pause pipeline if GPU usage exceeds this %

# Scene detection
# threshold is overridden at runtime by the UI sensitivity slider.
# These values are the defaults when no slider input is provided.
scenes:
  threshold: 22.0              # MAD threshold for cut detection (lower = more cuts)
  min_scene_len_frames: 12     # scenes shorter than this are merged with their neighbour
  downscale_width: 320         # frame width for diff computation (smaller = faster)

# Candidate frame sampling
extract:
  per_scene_candidates: 9      # number of candidate frames to sample per scene
  per_scene_keep_pct: 0.40     # fraction of candidates to keep after per-scene ranking

# Selection
selection:
  shortlist_pct:        0.25   # fraction of scenes for Stage 2 deep analysis
  top_k: 10                    # maximum number of shots to select globally
  dedupe_hash_threshold: 8     # hamming distance for perceptual hash dedupe (0-64)
  diversity_weight: 0.5        # balance between quality (0) and diversity (1)
  min_shot_duration_sec: 2.0   # shots below this receive a score penalty
  soft_min_duration_sec: 1.0   # shots below this are excluded entirely
  content_filter:
    min_palette_entropy:  2.5    # below this = likely title card (few colors)
    min_occupancy_score: 15.0    # below this = sparse content (logo/graphic)
    min_depth_separation: 5.0    # below this = flat image (no depth)
    min_histogram_std:   20.0    # below this = near-uniform tone (black/white bg)
    min_saturation_mean:  8.0    # below this = desaturated (credits/text)

# Scoring pillar weights (must sum to 1.0)
weights:
  technical:  0.50
  creative:   0.30
  subjective: 0.20

# Category weights within each pillar (must sum to 1.0)
category_weights:
  exposure:    0.18
  lighting:    0.18
  composition: 0.18
  movement:    0.14
  color:       0.14
  quality:     0.10
  narrative:   0.08

# Hero clip extraction
clip_export:
  handle_sec:  4.0    # handle length added each side of the best window (seconds)
  min_dur:     2.0    # minimum window duration (seconds)
  max_dur:     6.0    # maximum window duration (seconds)

# Feature flags
features:
  qc_pack_enabled:        false   # enables VMAF/PSNR/SSIM (requires reference video)
  clip_enabled:           true    # CLIP embeddings for Creative pillar
  vlm_rationale_enabled:  false   # VLM API call for shot rationale text
  gpu_enabled:            true    # Use GPU if available (CUDA/MPS auto-detected, any GPU works)
  midas_enabled:          true    # MiDaS DPT_Hybrid depth estimation (primary depth_separation source)
  yolo_enabled:           true    # YOLO subject and face detection