[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# marks
markers =
    slow: tests that run the full pipeline (deselect with -m "not slow")

# default options
addopts =
    -v
    --tb=short
    --timeout=120

# timeout per test in seconds (requires pytest-timeout)
timeout = 120